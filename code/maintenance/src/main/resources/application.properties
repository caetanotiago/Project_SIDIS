spring.application.name=maintenance

# ----------------------------------------------------------------------------------------------
# Valores por omissão = instância 1. As outras réplicas usam os perfis instance2 / instance3
# (application-instanceN.properties). Portas: ver docs/2-containers/Ports.md
# ----------------------------------------------------------------------------------------------
server.port=8082
aisafe.instance-id=maintenance-1

# http por omissão; o perfil "tls" muda para https (todas as URLs abaixo usam esta variável)
aisafe.scheme=http

# Base de dados por instância: H2 em ficheiro, só desta réplica (sobrevive a reinícios).
# Relativo à pasta de trabalho: code/data/ quando arrancado pelos scripts (ignorado pelo git).
# Contém o write model (registos/templates desta réplica), os read models e os eventos já processados.
spring.datasource.url=jdbc:h2:file:./data/maintenancedb-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Réplicas peer deste serviço (sem incluir a própria). Só usadas para reencaminhar COMANDOS
# (PATCH) para a réplica dona do registo; as leituras são respondidas pelos read models locais.
aisafe.peers.urls=${aisafe.scheme}://localhost:8182,${aisafe.scheme}://localhost:8282

# Aircraft Management: todas as réplicas (round-robin + failover). B3b (mudança de estado) é sempre HTTP;
# B3a, B3c e B3d só são usadas como fallback quando a cópia local (eventos) ainda não tem o dado.
services.aircraft.urls=${aisafe.scheme}://localhost:8081,${aisafe.scheme}://localhost:8181,${aisafe.scheme}://localhost:8281

# Resiliência das chamadas remotas (biblioteca common)
aisafe.http.connect-timeout=1s
aisafe.http.read-timeout=3s
aisafe.http.max-retries=2
aisafe.http.initial-backoff=100ms
aisafe.http.aggregation-timeout=5s
aisafe.circuit-breaker.failure-threshold=3
aisafe.circuit-breaker.open-duration=10s

# Segurança. Têm de ser iguais em todos os serviços; em produção definir por variável de ambiente.
# jwt.secret: o token é emitido por um serviço e validado pelos outros.
jwt.secret=${JWT_SECRET:UmaChaveSuperSecretaParaOProjetoPSOFT2026QueNinguemVaiAdivinhar}
# Segredo partilhado entre serviços/réplicas (header X-Service-Key)
aisafe.security.service-key=${AISAFE_SERVICE_KEY:dev-only-service-key-aisafe-2026}
# POST /auth/dev-token — só para desenvolvimento/demo (desligar com AISAFE_DEV_TOKEN=false)
aisafe.security.dev-token.enabled=${AISAFE_DEV_TOKEN:true}

# WP#0A: templates de referência carregados em todas as réplicas (ids iguais em todas)
maintenance.bootstrap.reference-templates=true
# Registos de demonstração (perfil "demo"; dados por réplica em application-instanceN.properties)
maintenance.demo.enabled=false

# ----------------------------------------------------------------------------------------------
# Mensagens (RabbitMQ / AMQP). Contratos: docs/2-containers/Integration-Contracts.md, secção 9.
# Publica em aisafe.maintenance.events; consome os seus próprios eventos (fila <instanceId>.maintenance),
# os do Aircraft Management (fila <instanceId>.aircraftmanagement: aircraft.*, aircraft-model.*)
# e os voos do Flight Routes (fila <instanceId>.flightroutes: scheduled-flight.*).
# AISAFE_MESSAGING_ENABLED=false: corre sem broker (os read models só têm as escritas desta réplica).
# ----------------------------------------------------------------------------------------------
aisafe.messaging.enabled=${AISAFE_MESSAGING_ENABLED:true}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.publisher-confirm-type=simple
aisafe.messaging.max-attempts=3
aisafe.messaging.initial-interval=500ms
aisafe.messaging.multiplier=2.0
aisafe.messaging.max-interval=5s
management.health.rabbit.enabled=${aisafe.messaging.enabled}

# Health: liveness = a JVM serve HTTP (usado pelos scripts); readiness inclui o RabbitMQ;
# /actuator/health mostra tudo (peers, circuit breakers, broker).
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoint.health.validate-group-membership=false
management.endpoint.health.group.liveness.include=livenessState,ping
management.endpoint.health.group.liveness.show-details=always
management.endpoint.health.group.readiness.include=readinessState,rabbit
management.endpoint.health.group.readiness.show-details=always

# Logs com a instância e o correlation id de cada pedido; um ficheiro por réplica
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{instance:-boot}] [%X{correlationId:--}] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{instance:-boot}] [%X{correlationId:--}] %logger{36} - %msg%n
logging.file.name=logs/${aisafe.instance-id}.log
logging.level.isep.sidis.common.peers=INFO
logging.level.AUDIT=INFO

springdoc.enable-hateoas=false
