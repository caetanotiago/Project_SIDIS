# "demo" profile: loads the demo data defined in application-instanceN.properties.
# Use it together with the instance profile, e.g. --spring.profiles.active=instance2,demo
aisafe.bootstrap.enabled=true

# Aircraft Management and Airports now publish their events: B1/B2 are answered from the local copies
# KNOWN_AIRCRAFT, KNOWN_AIRCRAFT_MODEL and KNOWN_AIRPORT (HTTP only on a miss). AISAFE_EXTERNAL_EVENTS=false turns it off.
aisafe.flightroutes.external-events.enabled=${AISAFE_EXTERNAL_EVENTS:true}
