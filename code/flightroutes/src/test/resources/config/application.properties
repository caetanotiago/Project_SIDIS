# Test-only overrides. Spring Boot loads classpath:/config/application.properties ON TOP of
# classpath:/application.properties (it does not replace it), so only these keys change in tests.
#
# The existing tests run without a broker: messaging is off by default. Tests that need RabbitMQ
# (e.g. RouteEventsBrokerIT) turn it on explicitly and are skipped when no broker is reachable.
aisafe.messaging.enabled=false
