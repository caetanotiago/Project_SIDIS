# Configuração só para testes. O Spring Boot carrega classpath:/config/application.properties POR CIMA de
# classpath:/application.properties (não o substitui), por isso só estas chaves mudam nos testes.
#
# Os testes correm sem broker: as mensagens ficam desligadas por omissão.
aisafe.messaging.enabled=false

# Os testes nunca escrevem nas BDs em ficheiro das réplicas reais (code/data/): H2 em memória.
spring.datasource.url=jdbc:h2:mem:airports-test;DB_CLOSE_DELAY=-1
