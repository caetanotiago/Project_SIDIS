spring.application.name=airports

# ----------------------------------------------------------------------------------------------
# Valores por omissão = instância 1. As outras réplicas usam os perfis instance2 / instance3
# (application-instanceN.properties). Portas: ver docs/2-containers/Ports.md
# ----------------------------------------------------------------------------------------------
server.port=8083
aisafe.instance-id=airports-1

# http por omissão; o perfil "tls" muda para https (todas as URLs abaixo usam esta variável)
aisafe.scheme=http

# H2 em memória, isolada por réplica (cada réplica tem os seus dados)
spring.datasource.url=jdbc:h2:mem:airportsdb-1;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Réplicas peer deste serviço (sem incluir a própria). Usadas no forwarding/agregação de GETs.
aisafe.peers.urls=${aisafe.scheme}://localhost:8183,${aisafe.scheme}://localhost:8283

# Microsserviços remotos: todas as réplicas (load balancing round-robin + failover).
# Usar com ReplicatedServiceClientFactory (ver flightroutes/clients/RestClientConfig.java). Apagar os que não forem usados.
services.aircraft.urls=${aisafe.scheme}://localhost:8081,${aisafe.scheme}://localhost:8181,${aisafe.scheme}://localhost:8281
services.maintenance.urls=${aisafe.scheme}://localhost:8082,${aisafe.scheme}://localhost:8182,${aisafe.scheme}://localhost:8282
services.flightroutes.urls=${aisafe.scheme}://localhost:8084,${aisafe.scheme}://localhost:8184,${aisafe.scheme}://localhost:8284

# Resiliência das chamadas remotas (biblioteca common)
aisafe.http.connect-timeout=1s
aisafe.http.read-timeout=3s
aisafe.http.max-retries=2
aisafe.http.initial-backoff=100ms
aisafe.http.aggregation-timeout=5s
aisafe.circuit-breaker.failure-threshold=3
aisafe.circuit-breaker.open-duration=10s

# Segurança. Têm de ser iguais em todos os serviços; em produção definir por variável de ambiente.
# jwt.secret: o token é emitido por um serviço e validado pelos outros.
jwt.secret=${JWT_SECRET:UmaChaveSuperSecretaParaOProjetoPSOFT2026QueNinguemVaiAdivinhar}
# Segredo partilhado entre serviços/réplicas (header X-Service-Key)
aisafe.security.service-key=${AISAFE_SERVICE_KEY:dev-only-service-key-aisafe-2026}
# POST /auth/dev-token — só para desenvolvimento/demo (desligar com AISAFE_DEV_TOKEN=false)
aisafe.security.dev-token.enabled=${AISAFE_DEV_TOKEN:true}


# Health checks: /actuator/health (inclui o estado dos peers e dos circuit breakers)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Logs com a instância e o correlation id de cada pedido; um ficheiro por réplica
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{instance:-boot}] [%X{correlationId:--}] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{instance:-boot}] [%X{correlationId:--}] %logger{36} - %msg%n
logging.file.name=logs/${aisafe.instance-id}.log
logging.level.isep.sidis.common.peers=INFO
logging.level.AUDIT=INFO

springdoc.enable-hateoas=false
