spring.application.name=flightroutes

# Porta e base de dados definidas em docs/Ports.md
server.port=8084

# H2 em memória, isolada deste serviço
spring.datasource.url=jdbc:h2:mem:flightRoutesdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Microsserviços remotos (ver docs/Ports.md)
services.aircraft.url=http://localhost:8081
services.airports.url=http://localhost:8083

# Tem de ser igual em todos os serviços: o token é emitido por um serviço e validado pelos outros
jwt.secret=UmaChaveSuperSecretaParaOProjetoPSOFT2026QueNinguemVaiAdivinhar
springdoc.enable-hateoas=false
