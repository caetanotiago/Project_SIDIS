spring.application.name=aircraftmanagement

# ----------------------------------------------------------------------------------------------
# Defaults = instance 1. The other replicas use the profiles instance2 / instance3
# (application-instanceN.properties). Ports: docs/2-containers/Ports.md
# ----------------------------------------------------------------------------------------------
server.port=8081
aisafe.instance-id=aircraftmanagement-1

# http by default; the "tls" profile switches to https (every URL below uses this variable)
aisafe.scheme=http

# Database per instance: a file-based H2 database owned by this replica only (survives restarts).
# Relative to the working directory: code/data/ when started by the scripts (ignored by git).
# Erase a replica's data (write model, read models and processed event ids) by deleting its files.
spring.datasource.url=jdbc:h2:file:./data/aircraftManagementdb-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Peer replicas of this service (not including itself). Used only to forward WRITES to the replica
# that owns the aircraft / model (owner-based writes); reads are answered from this replica's read models.
aisafe.peers.urls=${aisafe.scheme}://localhost:8181,${aisafe.scheme}://localhost:8281

# Resilience of the remote calls (common library). Aircraft Management no longer calls other services
# over HTTP (Flight Routes data arrives as events), but forwarding a write to the owner replica uses these.
aisafe.http.connect-timeout=1s
aisafe.http.read-timeout=3s
aisafe.http.max-retries=2
aisafe.http.initial-backoff=100ms
aisafe.http.aggregation-timeout=5s
aisafe.circuit-breaker.failure-threshold=3
aisafe.circuit-breaker.open-duration=10s

# Security. Must be the same in every service; in production set them through environment variables.
# jwt.secret: the token is issued by one service and validated by the others.
jwt.secret=${JWT_SECRET:UmaChaveSuperSecretaParaOProjetoPSOFT2026QueNinguemVaiAdivinhar}
# Secret shared between services/replicas (header X-Service-Key)
aisafe.security.service-key=${AISAFE_SERVICE_KEY:dev-only-service-key-aisafe-2026}
# POST /auth/dev-token - development/demo only (turn off with AISAFE_DEV_TOKEN=false)
aisafe.security.dev-token.enabled=${AISAFE_DEV_TOKEN:true}

# Demo data: enabled by the "demo" profile (the data of each replica is in application-instanceN.properties)
aisafe.bootstrap.enabled=false
aisafe.bootstrap.models=A320:Airbus:180:24210:6100:828,B737:Boeing:189:26020:5600:842
aisafe.bootstrap.aircrafts=CS-TUA:A320:180:2019-05-14,CS-TUB:B737:189:2018-03-02:UNDER_MAINTENANCE

# ----------------------------------------------------------------------------------------------
# Messaging (RabbitMQ / AMQP). Event contracts: docs/2-containers/Integration-Contracts.md, section 9
# Credentials come from the environment (infra/.env, loaded by scripts/run-instance.* and start-*.*).
# Publishes on aisafe.aircraftmanagement.events; consumes its own events (queue <instanceId>.aircraftmanagement)
# and the route / scheduled-flight events of Flight Routes (queue <instanceId>.flightroutes).
# AISAFE_MESSAGING_ENABLED=false runs this replica without the broker: it still answers from its own
# read models, which then only contain the writes made on this replica (and no Flight Routes data).
# ----------------------------------------------------------------------------------------------
aisafe.messaging.enabled=${AISAFE_MESSAGING_ENABLED:true}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
# The broker confirms every published event (EventPublisher waits for the confirm)
spring.rabbitmq.publisher-confirm-type=simple
# Consumer retries before a message goes to the dead-letter queue (EventMessagingAutoConfiguration)
aisafe.messaging.max-attempts=3
aisafe.messaging.initial-interval=500ms
aisafe.messaging.multiplier=2.0
aisafe.messaging.max-interval=5s
# The broker health indicator exists only when messaging is on
management.health.rabbit.enabled=${aisafe.messaging.enabled}

# ----------------------------------------------------------------------------------------------
# Health. /actuator/health/liveness  = the JVM serves HTTP (used by scripts/start-all.*).
#         /actuator/health/readiness = ready for traffic, INCLUDING the RabbitMQ connection.
#         /actuator/health           = everything (peers, circuit breakers, broker), for humans.
# A replica whose broker is down stays live and keeps answering HTTP; only readiness goes DOWN.
# validate-group-membership=false: "rabbit" does not exist when messaging is off.
# ----------------------------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoint.health.validate-group-membership=false
management.endpoint.health.group.liveness.include=livenessState,ping
management.endpoint.health.group.liveness.show-details=always
management.endpoint.health.group.readiness.include=readinessState,rabbit
management.endpoint.health.group.readiness.show-details=always

# Logs with the instance and the correlation id of each request; one file per replica
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{instance:-boot}] [%X{correlationId:--}] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{instance:-boot}] [%X{correlationId:--}] %logger{36} - %msg%n
logging.file.name=logs/${aisafe.instance-id}.log
logging.level.isep.sidis.common.peers=INFO
logging.level.AUDIT=INFO

springdoc.enable-hateoas=false
