# Perfil "tls": encriptação em trânsito (HTTPS) no servidor e em todas as chamadas a outros
# serviços/réplicas. Usar com o perfil da instância, ex.: --spring.profiles.active=instance1,tls
# O certificado de desenvolvimento (CN=localhost, SAN localhost/127.0.0.1) vem da biblioteca common;
# para gerar outro: scripts/generate-dev-certs.sh (ou .ps1). Não usar este certificado em produção.
aisafe.scheme=https

server.ssl.enabled=true
server.ssl.key-store=classpath:tls/aisafe-dev-keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${AISAFE_TLS_PASSWORD:changeit}
server.ssl.key-alias=aisafe
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2

aisafe.tls.trust-store=classpath:tls/aisafe-dev-truststore.p12
aisafe.tls.trust-store-password=${AISAFE_TLS_PASSWORD:changeit}
