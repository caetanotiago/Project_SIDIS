# Aircraft Management - replica 1 (see docs/2-containers/Ports.md); database file code/data/aircraftManagementdb-1.mv.db
server.port=8081
aisafe.instance-id=aircraftmanagement-1
spring.datasource.url=jdbc:h2:file:./data/aircraftManagementdb-1
aisafe.peers.urls=${aisafe.scheme}://localhost:8181,${aisafe.scheme}://localhost:8281

# Demo data of this replica (only with the "demo" profile). Inserted once (skipped when it already exists).
# Models:   modelName:manufacturer:seats:fuelCapacity:maximumRange(km):cruisingSpeed
# Aircraft: registration:modelName:seats:manufacturingDate[:status]
aisafe.bootstrap.models=A320:Airbus:180:24210:6100:828,B737:Boeing:189:26020:5600:842
aisafe.bootstrap.aircrafts=CS-TUA:A320:180:2019-05-14,CS-TUB:B737:189:2018-03-02:UNDER_MAINTENANCE
