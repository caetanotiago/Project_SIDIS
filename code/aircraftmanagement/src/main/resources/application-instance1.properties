# Opcional (coerência com Integration-Contracts §5: um ficheiro por instância).
# Para usar: arrancar a instância 1 com --spring.profiles.active=instance1
server.port=8081
aisafe.instance-id=aircraftmanagement-1
spring.datasource.url=jdbc:h2:mem:aircraftManagementdb-1;DB_CLOSE_DELAY=-1
aisafe.peers.urls=${aisafe.scheme}://localhost:8181,${aisafe.scheme}://localhost:8281

aisafe.bootstrap.enabled=true
aisafe.bootstrap.models=A320:Airbus:180:24210:6100:828,B737:Boeing:189:26020:5600:842
aisafe.bootstrap.aircrafts=CS-TUA:A320:180:2019-05-14,CS-TUB:B737:189:2018-03-02:UNDER_MAINTENANCE
