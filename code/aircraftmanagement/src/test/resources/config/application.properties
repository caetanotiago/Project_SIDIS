# Test-only overrides. Spring Boot loads classpath:/config/application.properties ON TOP of
# classpath:/application.properties (it does not replace it), so only these keys change in tests.
#
# The tests run without a broker: messaging is off by default.
aisafe.messaging.enabled=false

# Tests never write the file databases of the real replicas (code/data/): in-memory H2 instead.
spring.datasource.url=jdbc:h2:mem:aircraftmanagement-test;DB_CLOSE_DELAY=-1
